# ===================================================================
# MySQL Profile for Production / Real Database Testing
# Run with: --spring.profiles.active=mysql
# ===================================================================

spring.datasource.url=jdbc:mysql://localhost:3306/covedb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

cove.jdbc.driver-class-name=com.mysql.cj.jdbc.Driver
cove.jdbc.url=jdbc:mysql://localhost:3306/covedb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
cove.jdbc.username=${SPRING_DATASOURCE_USERNAME:root}
cove.jdbc.password=${SPRING_DATASOURCE_PASSWORD:root}
