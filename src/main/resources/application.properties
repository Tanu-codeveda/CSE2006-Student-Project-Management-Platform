server.port=8080
spring.application.name=cove-student-project-platform

# Default Persistence Profile: H2 (Zero-configuration for instant academic evaluation)
spring.datasource.url=jdbc:h2:mem:covedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# H2 Console (Accessible at /h2-console for database inspection)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Multipart / File upload/download configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Background Daemon Configuration (in milliseconds)
cove.daemon.deadline-check-interval-ms=30000
cove.daemon.overdue-threshold-hours=48

# Direct JDBC Analytics configuration
cove.jdbc.driver-class-name=org.h2.Driver
cove.jdbc.url=jdbc:h2:mem:covedb
cove.jdbc.username=sa
cove.jdbc.password=
